<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mở Quán Đi!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div id="bubbles" aria-live="polite"></div>

<header id="hud" hidden>
  <div class="hud-l">
    <span id="hudCh" class="hud-ch"></span>
    <span id="hudCups" class="chip">🧋 0</span>
    <span id="hudZalo" class="chip" hidden>👥 0</span>
    <button id="hudRoom" class="chip room-chip" hidden></button>
  </div>
  <div class="hud-r">
    <button id="btnDict" class="icon-btn" aria-label="Từ điển founder">📖</button>
    <button id="btnVoice" class="icon-btn" aria-label="Tắt giọng đọc">🗣️</button>
    <button id="btnSound" class="icon-btn" aria-label="Tắt hiệu ứng âm thanh">🔊</button>
  </div>
</header>

<aside id="dict" hidden>
  <h2>📖 Từ điển founder</h2>
  <div id="dictBody"></div>
</aside>

<div id="dialog" hidden></div>
<div id="panel" hidden></div>
<div id="float" aria-live="polite"></div>
<div id="screen"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/meshopt_decoder.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
<script src="models.js"></script>
<script src="firebase-config.js"></script>
<script src="net.js"></script>
<script src="data.js"></script>
<script src="audio/manifest.js"></script>
<script src="scene.js"></script>
<script src="game.js"></script>
</body>
</html>
